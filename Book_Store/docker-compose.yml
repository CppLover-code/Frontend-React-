services:

  db:
    image: postgres:18
    env_file: ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
    ports:
      - "9000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/media:/app/media

volumes:
  postgres_data: