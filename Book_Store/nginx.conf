server {
    listen 80;

    # React application
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API and Django service pages - proxy to Gunicorn
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /swagger/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Django static files (collected by collectstatic) and uploaded files
    location /static/ {
        alias /staticfiles/;
    }

    location /media/ {
        alias /media/;
    }
}